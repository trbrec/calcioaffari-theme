name: Import CalcioAffari Theme
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and import theme
        shell: bash
        run: |
          cat theme-part-*.b64 | base64 --decode > /tmp/calcioaffari-theme.zip
          mkdir -p /tmp/calcioaffari-theme
          unzip -q /tmp/calcioaffari-theme.zip -d /tmp/calcioaffari-theme
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/calcioaffari-theme/calcioaffari-production/. .
          git config user.name "CalcioAffari Deploy"
          git config user.email "andrea.tognassi@trbrec.com"
          git add -A
          git commit -m "Release CalcioAffari theme 0.6.0"
          git push
